name: Update data centre data

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/curated.json', 'scripts/**', '.github/workflows/update-data.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install pandas zipcodes

      - name: Download Epoch AI data
        run: |
          mkdir -p epoch
          curl -fsSL -o epoch/data_centers.csv https://epoch.ai/data/data_centers/data_centers.csv
          curl -fsSL -o epoch/data_center_timelines.csv https://epoch.ai/data/data_centers/data_center_timelines.csv
          wc -l epoch/*.csv

      - name: Convert
        run: |
          cp data/datacentres.json /tmp/prev.json
          python scripts/convert_epoch.py epoch data/datacentres.json "$(date -u +%F)"
          python scripts/diff_changes.py /tmp/prev.json data/datacentres.json data/changes.json "$(date -u +%F)"

      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/datacentres.json data/changes.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly data update $(date -u +%F)"
            git push
          fi
