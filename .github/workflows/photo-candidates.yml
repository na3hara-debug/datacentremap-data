name: Find photo candidates (Wikimedia Commons)

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: 'How many records to search (largest first)'
        default: '60'

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search Commons
        run: python scripts/photo_candidates.py data/datacentres.json /tmp/cand "${{ github.event.inputs.max_records }}"
      - name: Publish to photo-candidates branch
        run: |
          cd /tmp/cand
          git init -q -b photo-candidates
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Photo candidates $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" photo-candidates
